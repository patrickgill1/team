<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0d0d10" />
    <meta name="description" content="GoalKickr — team management for soccer. RSVPs, chat, stats, and media in one place." />

    <!-- Open Graph + Twitter cards. Drive the preview that WhatsApp,
         iMessage, Slack, and social feeds render when someone pastes
         an app.goalkickr.com URL (invite links especially). Kept
         audience-neutral so an adult pickup invite doesn't read as
         "youth soccer" and a youth club invite doesn't read as
         "adult league" — both cohorts see the same landing. Absolute
         URLs on og:image because relative paths break in most
         scrapers. Update the image if we ship a proper 1200x630 hero
         graphic; logo512 is universally safe as a square fallback. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GoalKickr" />
    <meta property="og:title" content="GoalKickr" />
    <meta property="og:description" content="Team management for soccer. RSVPs, chat, stats, and media in one place." />
    <meta property="og:url" content="https://app.goalkickr.com" />
    <meta property="og:image" content="https://app.goalkickr.com/logo512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="GoalKickr" />
    <meta name="twitter:description" content="Team management for soccer. RSVPs, chat, stats, and media in one place." />
    <meta name="twitter:image" content="https://app.goalkickr.com/logo512.png" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- iOS Add-to-Home-Screen: render as a chrome-less standalone
         app shell instead of a Safari-wrapped webpage. Matters while
         the Android Play listing is still closed testing and web
         mobile is the actual Android experience — parents who tap
         "Add to Home Screen" should get an app-like frame with our
         icon and no Safari URL bar. Android Chrome already honors
         the manifest's display:standalone; these tags make iOS
         match. Ignored by Capacitor's native shells. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GoalKickr" />

    <!--
      Apple's native Smart App Banner is intentionally disabled: we use
      our own InstallAppBanner component on every mobile browser (incl.
      iOS Safari) for consistent branding. Re-enable this line if you'd
      rather have Apple's native banner on Safari (it can show "Open"
      when the app is already installed, which the web banner can't):
      <meta name="apple-itunes-app" content="app-id=6770324158" />
    -->

    <title>GoalKickr</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
