name = "firefc16-mailer"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Set the production secret with:
#   cd worker && npx wrangler secret put NOTIFY_SECRET
# (use the same value you put in Vercel env REACT_APP_NOTIFY_SECRET)
#
# Optional secrets (only if you want to swap MailChannels for Resend later):
#   npx wrangler secret put RESEND_API_KEY

[vars]
FROM_EMAIL = "noreply@firefc16.com"
FROM_NAME  = "Fire FC16"
APP_ORIGIN = "https://firefc16.com"

# CORS allow-list (comma separated). Vercel preview URLs added later if needed.
ALLOWED_ORIGINS = "https://firefc16.com,https://www.firefc16.com,http://localhost:3000"

# Weekly digest: Sundays at 22:00 UTC = 6pm America/New_York during EDT
# (will be 5pm EST in winter — acceptable; can switch to two crons later)
[triggers]
crons = ["0 22 * * 0"]
