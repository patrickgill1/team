<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; }
  .stage {
    width: 1024px; height: 500px; position: relative;
    background:
      radial-gradient(900px 500px at 78% 50%, rgba(56,189,248,0.28), transparent 60%),
      radial-gradient(700px 500px at 12% 120%, rgba(14,165,233,0.22), transparent 55%),
      linear-gradient(120deg, #0a1628 0%, #0f1f35 45%, #1e3a5f 100%);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }
  /* faint pitch lines on the right */
  .pitch { position: absolute; right: -60px; top: 50%; transform: translateY(-50%);
    width: 520px; height: 520px; border-radius: 50%;
    border: 2px solid rgba(125,211,252,0.10); }
  .pitch::after { content: ""; position: absolute; inset: 150px; border-radius: 50%;
    border: 2px solid rgba(125,211,252,0.10); }
  .vline { position: absolute; right: 199px; top: 40px; bottom: 40px;
    width: 2px; background: rgba(125,211,252,0.08); }

  .content { position: absolute; left: 70px; top: 0; bottom: 0;
    display: flex; align-items: center; gap: 40px; }
  .logo { width: 168px; height: 168px; border-radius: 38px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.06);
    flex-shrink: 0; }
  .text { color: #fff; }
  .wordmark { font-size: 92px; font-weight: 800; letter-spacing: -1.5px; line-height: 0.95;
    background: linear-gradient(180deg,#ffffff 0%, #bae6fd 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tag { margin-top: 14px; font-size: 27px; font-weight: 600; color: #e0f2fe; letter-spacing: 0.2px; }
  .sub { margin-top: 8px; font-size: 19px; font-weight: 500; color: rgba(186,230,253,0.72);
    letter-spacing: 0.4px; }
</style>
</head>
<body>
  <div class="stage">
    <div class="pitch"></div>
    <div class="vline"></div>
    <div class="content">
      <img class="logo" src="file:///tmp/firefc-logo.png" />
      <div class="text">
        <div class="wordmark">Fire&nbsp;FC</div>
        <div class="tag">The all-in-one app for youth soccer teams</div>
        <div class="sub">Schedules · RSVPs · Highlights · Stats · Chat</div>
      </div>
    </div>
  </div>
</body>
</html>
