name = "firefc16-mailer"
main = "src/index.ts"
compatibility_date = "2024-09-23"
workers_dev = true

# Set the production secret with:
#   cd worker && npx wrangler secret put NOTIFY_SECRET
# (use the same value you put in Vercel env REACT_APP_NOTIFY_SECRET)
#
# Optional secrets (only if you want to swap MailChannels for Resend later):
#   npx wrangler secret put RESEND_API_KEY

[vars]
FROM_EMAIL = "noreply@firefc16.com"
FROM_NAME  = "Fire FC"
APP_ORIGIN = "https://firefc.app"
# Required by /auth/exchange-id-token to validate the `aud` claim on
# Firebase ID tokens received from the native plugin's getIdToken(). The
# project ID isn't secret — Firebase exposes it in client-side config.
FIREBASE_PROJECT_ID = "soccer-team-app-7f6b4"

# CORS allow-list (comma separated). Vercel preview URLs added later if needed.
# capacitor://localhost is the iOS WebView origin; without it the native app
# can't hit the worker.
ALLOWED_ORIGINS = "https://firefc16.com,https://www.firefc16.com,https://firefc.app,https://www.firefc.app,http://localhost:3000,capacitor://localhost,ionic://localhost"

# Cron schedule:
#   Sundays 22:00 UTC (Sun 4pm MDT)  — weekly digest + admin "needs attention" roundup
#   Daily 16:00 UTC (10am MDT)       — registration drip nudges (parent funnel)
[triggers]
crons = ["0 22 * * SUN", "0 16 * * *"]
