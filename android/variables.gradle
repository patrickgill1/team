ext {
    minSdkVersion = 23
    compileSdkVersion = 35
    targetSdkVersion = 35
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'

    // @capacitor-firebase/authentication: bundle play-services-auth so
    // Google Sign-In is available at runtime. Without this flag the
    // plugin links play-services-auth as compileOnly (not packaged),
    // crashing the app on launch with:
    //   NoClassDefFoundError: com/google/android/gms/auth/api/signin/GoogleSignIn
    // (thrown while the Firebase Auth plugin registers).
    rgcfaIncludeGoogle = true
    playServicesAuthVersion = '20.7.0'
}